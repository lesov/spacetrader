<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Trader 2175 Local MVP</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="command-surface" aria-label="Space Trader">
        <header class="topbar">
          <div>
            <h1>Space Trader</h1>
            <p class="campaign-line"><span id="campaign-label"></span> | <span id="market-climate"></span></p>
            <p id="route-line" class="route-line"></p>
          </div>
          <dl class="status-grid" aria-label="Ship status">
            <div>
              <dt>Credits</dt>
              <dd id="credits"></dd>
            </div>
            <div>
              <dt>Fuel</dt>
              <dd id="fuel"></dd>
            </div>
            <div>
              <dt>Cargo</dt>
              <dd id="cargo-space"></dd>
            </div>
            <div>
              <dt>Date</dt>
              <dd id="current-date"></dd>
            </div>
            <div>
              <dt>Location</dt>
              <dd id="current-planet"></dd>
            </div>
            <div>
              <dt>Local Trade</dt>
              <dd id="trade-status"></dd>
            </div>
          </dl>
        </header>

        <section class="flight-deck">
          <div class="map-stack">
            <div class="map-panel">
              <canvas id="star-map" width="720" height="420" aria-label="Solar System trade route map"></canvas>
            </div>
            <aside class="map-legend" aria-labelledby="map-legend-heading">
              <h3 id="map-legend-heading">Map Colors</h3>
              <div id="map-legend" class="map-legend-list"></div>
            </aside>
          </div>

          <aside class="planet-panel" aria-labelledby="planet-heading">
            <div>
              <p class="eyebrow">Current Market</p>
              <h2 id="planet-heading"></h2>
              <p id="planet-note" class="planet-note"></p>
              <div class="location-meta" aria-label="Location context">
                <span id="location-alignment"></span>
                <span id="location-risk"></span>
              </div>
              <p id="strategic-context" class="strategic-context"></p>
            </div>
            <div>
              <h3>Exports</h3>
              <div id="production-list" class="chip-row"></div>
            </div>
            <div>
              <h3>Destinations</h3>
              <div id="destinations" class="destination-list"></div>
            </div>
          </aside>
        </section>

        <section class="trade-layout">
          <section class="market-panel" aria-labelledby="market-heading">
            <div class="section-heading">
              <h2 id="market-heading">Market</h2>
              <span id="market-context"></span>
            </div>
            <div class="market-table-wrap">
              <table class="market-table">
                <thead>
                  <tr>
                    <th>Resource</th>
                    <th>Price</th>
                    <th>Owned</th>
                    <th>Buy Qty</th>
                    <th>Buy</th>
                    <th>Sell Qty</th>
                    <th>Sell</th>
                  </tr>
                </thead>
                <tbody id="market-body"></tbody>
              </table>
            </div>
          </section>

          <aside class="side-stack">
            <section class="cargo-panel" aria-labelledby="cargo-heading">
              <div class="section-heading">
                <h2 id="cargo-heading">Cargo</h2>
                <span id="cargo-context"></span>
              </div>
              <div id="cargo-list" class="cargo-list"></div>
            </section>

            <section class="log-panel" aria-labelledby="log-heading">
              <div class="section-heading">
                <h2 id="log-heading">Log</h2>
                <button id="reset-button" type="button">Reset</button>
              </div>
              <ol id="message-log" class="message-log"></ol>
            </section>
          </aside>
        </section>
      </section>
    </main>
    <dialog id="travel-confirmation" class="travel-dialog" aria-labelledby="travel-confirmation-title">
      <form method="dialog">
        <h2 id="travel-confirmation-title">Leave Without Trading?</h2>
        <p id="travel-confirmation-message"></p>
        <div class="dialog-actions">
          <button id="cancel-travel" type="button">Stay</button>
          <button id="confirm-travel" type="button">Travel</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
